name: generate-contribution-3d-animation

on:
  schedule:
    - cron: "10 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shared-execution-lock
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: luiz1361/github-profile-3d-contrib@f234ae01c07dcb685fd5f259ffc24bacb1fe7314 # ratchet:luiz1361/github-profile-3d-contrib@v0.9.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          mkdir -p contribution-3d-animation
          mv profile-3d-contrib/profile-night-green.svg contribution-3d-animation/dark.svg
          mv profile-3d-contrib/profile-green.svg contribution-3d-animation/light.svg
          rm -rf profile-3d-contrib
          git add -A .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci: generate-contribution-3d-animation"
            git push
          fi
